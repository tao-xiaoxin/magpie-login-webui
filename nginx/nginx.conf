# magpie-login-webui 的站点配置（http 级），两种部署方式共用同一份，不是 nginx 主配置。
#   A. 容器：compose 把本文件挂成 /etc/nginx/templates/default.conf.template，
#      由 nginx:stable-alpine 的 envsubst 渲染到 /etc/nginx/conf.d/default.conf，
#      NGINX_ENVSUBST_FILTER=^MAGPIE_ 只替换 ${MAGPIE_*}。
#   B. 宿主机：envsubst 渲染成 runtime/magpie.conf，再由 runtime/nginx.conf 在 http{} 里 include
#      （步骤见 README.md）。渲染结果含密钥，权限必须是 0600。
# nginx 自身的 $host、$request_uri 等变量保持原样，不会被替换。
# 所有密钥来自 env 文件，不写入前端代码、源码或镜像。

# 真实密钥长度为 48/64 字符，默认哈希桶放不下，nginx 会报
# "could not build map_hash" 并拒绝启动。
map_hash_bucket_size 128;
map_hash_max_size 4096;

# magpie 管理页的 Web key 只由反向代理注入上游请求，绝不发给浏览器。
# 不按 $host 匹配：Host 头由客户端控制，挡不住人，注入本身也不依赖它。
# （Cookie 在下面 location / 里直接拼给上游）

# /v1、/v1beta 的 Bearer key 白名单，fail-closed。
# 这把 key 同时就是转发给 magpie 网关的 key，nginx 原样透传，不做替换。
map $http_authorization $magpie_api_key_ok {
    default 0;
    "Bearer ${MAGPIE_API_KEY}" 1;
}

# 登录会话校验（HttpOnly Cookie 由 /api/v1/auth/sessions 下发）。
# Cookie 里放的就是登录密码：只有一个凭据，改密码即让所有会话失效。
map $cookie_magpie_session $magpie_session_ok {
    default 0;
    "${MAGPIE_LOGIN_PASSWORD}" 1;
}

# 登录凭据：前端把 "用户名:密码" 放在 X-Magpie-Login 头里。
map $http_x_magpie_login $magpie_login_ok {
    default 0;
    "${MAGPIE_LOGIN_USER}:${MAGPIE_LOGIN_PASSWORD}" 1;
}

# 会话续期：每次通过认证后把有效期续到 MAGPIE_SESSION_RENEW 秒。
# 该值留空或为 0 时渲染出空值，Nginx 不发送 Set-Cookie，即关闭续期（到期重新登录）。
map "${MAGPIE_SESSION_RENEW}" $magpie_renew_cookie {
    ""  "";
    "0" "";
    default "magpie_session=${MAGPIE_LOGIN_PASSWORD}; Path=/; Max-Age=${MAGPIE_SESSION_RENEW}; HttpOnly; SameSite=Strict${MAGPIE_COOKIE_SECURE_FLAG}";
}

# 兼容原前端的 CSRF 协议：静态方案没有服务端状态，用固定字符串做同源校验。
# 这个值本来就是公开的（谁都能 GET 到），写死即可，不需要配。
map $http_x_csrf_token $magpie_csrf_ok {
    default 0;
    "magpie-webui" 1;
}

map $http_upgrade $magpie_connection_upgrade {
    default upgrade;
    '' close;
}

# 登录尝试限流，纯 Nginx 实现，无需应用服务。
limit_req_zone $binary_remote_addr zone=magpie_login:1m rate=10r/m;

# 上游地址可切换：magpie（Compose 服务名）或 127.0.0.1（宿主机安装）。
upstream magpie_web { server ${MAGPIE_UPSTREAM_HOST}:3430; }
upstream magpie_api { server ${MAGPIE_UPSTREAM_HOST}:3425; }

server {
    # 方式二固定 80（由 ports 映射到宿主机）；方式一用自定义高端口，
    # 避免与服务器上已有的站点抢端口，也无需改动 /etc/nginx。
    listen ${MAGPIE_HTTP_PORT};
    # 不校验 Host：谁来访问都要先过登录，匹配 Host 只多一种踩坑方式。
    server_name _;
    # 方式二由 compose 传 /usr/share/nginx/html；方式一传服务器上 dist/ 的路径。
    root ${MAGPIE_WEB_ROOT};

    # 口令出现在请求头中，关闭访问日志避免凭据进入日志。
    # 错误日志交给主配置：方式二沿用镜像默认，方式一写在项目目录内，
    # 两者都不会修改系统已有的日志配置。
    access_log off;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # ------------------------------------------------ 原项目 dist/ 的静态资源
    # /login 直接返回 dist/index.html，不经过任何应用服务器。
    location = /login {
        alias ${MAGPIE_WEB_ROOT}/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    location ^~ /login-assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(favicon\.svg|feature-[a-z-]+\.(png|svg)|magpie-[a-z-]+\.(png|svg))$ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ------------------------------------- 兼容原前端的认证 API（纯 Nginx）
    location = /api/v1/auth/csrf {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"csrfToken":"magpie-webui"}';
    }

    location = /api/v1/auth/sessions {
        limit_req zone=magpie_login burst=5 nodelay;
        if ($magpie_csrf_ok = 0) { return 403; }
        if ($magpie_login_ok = 0) { return 401; }
        add_header Set-Cookie "magpie_session=${MAGPIE_LOGIN_PASSWORD}; Path=/; Max-Age=${MAGPIE_SESSION_TTL}; HttpOnly; SameSite=Strict${MAGPIE_COOKIE_SECURE_FLAG}" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 201 '{"redirectTo":"/"}';
    }

    # ------------------------------- auth_request 子请求：纯 Nginx，无后端服务
    location = /_magpie_auth {
        internal;
        if ($magpie_session_ok = 0) { return 401; }
        return 204;
    }

    # ------------------------------------------------------------- API 网关
    # 不继承浏览器会话、不携带 Web key；客户端自己的 Bearer key 原样透传，
    # 由 magpie 侧再校验一次 gateway key，nginx 不再替换成另一把 key。
    location ~ ^/(v1|v1beta)(/|$) {
        if ($magpie_api_key_ok = 0) { return 401; }
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_pass http://magpie_api;
    }

    # --------------------------------------------------------- magpie 管理页
    location / {
        auth_request /_magpie_auth;
        error_page 401 = @magpie_login;
        proxy_hide_header Set-Cookie;
        # 通过认证即续期；$magpie_renew_cookie 为空时不发送该响应头。
        add_header Set-Cookie $magpie_renew_cookie always;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        # Web key 在这里注入，浏览器从头到尾看不到它。
        proxy_set_header Cookie "magpie_web_3430=${MAGPIE_WEB_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $magpie_connection_upgrade;
        proxy_pass http://magpie_web;
    }

    location @magpie_login {
        return 303 /login;
    }
}

# ---------------------------------------------------------------------------
# 生产 HTTPS（HTTP 明文仅限本机验证，公网必须使用 HTTPS）：
# 1. 在 docker-compose.yml 中启用 443 端口映射与 ./certs:/etc/nginx/tls:ro 挂载；
# 2. .env 里把 MAGPIE_LOGIN_ORIGIN 改成 https://你的域名，
#    并把 MAGPIE_COOKIE_SECURE_FLAG 填 "; Secure"；
# 3. 把上面的 80 端口 server 改成只做跳转，并新增下列 443 server（location 相同）：
